<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>AgentifyMe – Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--b:#0F52BA;--bg:#fff;--t:#14213d;--m:#5b6b86;--l:#e3e8f2;--s:#f3f6fc;--fb:#0F52BA;--ig:#c13584;--wa:#1f9d55;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--b:#0F52BA;--bg:#0e1524;--t:#e8eefc;--m:#9aa9c7;--l:#25314b;--s:#16203a;--fb:#0F52BA}}
:root[data-theme=dark]{--b:#0F52BA;--bg:#0e1524;--t:#e8eefc;--m:#9aa9c7;--l:#25314b;--s:#16203a;--fb:#0F52BA}
html{color-scheme:light dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--t);font:15px/1.5 'Plus Jakarta Sans',system-ui,sans-serif}
a{color:inherit;text-decoration:none}
#app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
nav{background:var(--s);border-right:1px solid var(--l);padding:16px 10px;position:sticky;top:0;align-self:start;height:100vh}
nav h1{font-size:17px;margin:0 8px 16px;color:var(--b)}
nav a{display:block;padding:9px 12px;border-radius:6px;color:var(--m);font-weight:600}
nav a.on{background:var(--b);color:#fff}
main{padding:24px;max-width:1000px;width:100%}
h2{margin:0 0 4px;font-size:22px}h3{margin:0 0 10px;font-size:15px}
.sub{color:var(--m);margin:0 0 18px}
.g{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.c{border:1px solid var(--l);border-radius:8px;padding:16px;background:var(--bg)}
.k b{display:block;font-size:24px}.k span{color:var(--m);font-size:13px}
label{display:block;font-weight:600;font-size:13px;margin-bottom:10px}
input,select,textarea{width:100%;margin-top:4px;padding:9px 10px;border:1px solid var(--l);border-radius:6px;background:var(--bg);color:var(--t);font:inherit}
button,.btn{background:var(--b);color:#fff;border:0;border-radius:6px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
button.o{background:transparent;color:var(--b);border:1px solid var(--b)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--b);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--l);white-space:nowrap}th{color:var(--m);font-size:13px}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--s);border:1px solid var(--l);font-size:12px;margin-right:4px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.br{display:grid;grid-template-columns:120px 1fr 40px;gap:8px;align-items:center;margin:8px 0;font-size:13px}
.br i{display:block;height:14px;background:var(--b)}.br b{text-align:right}
.dl{display:flex;justify-content:space-between;color:var(--m);font-size:12px}
.inb{display:grid;grid-template-columns:minmax(240px,320px) 1fr;gap:14px}
.cv{padding:10px 12px;border-bottom:1px solid var(--l);cursor:pointer}.cv.on{background:var(--s)}.cv b.u{color:var(--b)}
.bub{max-width:75%;padding:8px 12px;border-radius:8px;margin:6px 0;background:var(--s)}.bub.me{margin-left:auto;background:var(--b);color:#fff}
pre{white-space:pre-wrap;background:var(--s);padding:12px;border-radius:6px;font-size:13px;margin:0}
.pl{border:2px solid var(--l)}.pl.on{border-color:var(--b)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--t);color:var(--bg);padding:10px 16px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%}#toast.show{opacity:1}
#login{position:fixed;inset:0;background:var(--bg);z-index:9;display:grid;place-items:center}
@media(max-width:760px){#app{grid-template-columns:1fr}nav{position:static;height:auto;display:flex;overflow-x:auto;padding:8px}nav h1{display:none}nav a{white-space:nowrap}.inb{grid-template-columns:1fr}main{padding:16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
:root{--hot:#d92d20;--warm:#f79009;--cold:#2e90fa}
.lgi{height:34px;width:auto;display:block;background:#fff;border-radius:6px;padding:3px 8px}
nav .lgi{margin:0 4px 16px}.lg{margin-bottom:12px}
.tag{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;border:0}
.s-Hot{background:#fde3e1;color:#b42318}.s-Warm{background:#fff0d6;color:#9a5b00}.s-Cold{background:#e0ecff;color:#0b4ab5}
nav{display:flex;flex-direction:column}nav a{display:flex;align-items:center;gap:10px}nav .sp{flex:1}.ni{flex:none}
@media(max-width:760px){nav{flex-direction:row;align-items:center}nav .sp{display:none}nav .lgi{margin:0 8px 0 0;flex:none}}
#cvw{border:1px solid var(--l);border-radius:8px;overflow:auto;height:68vh;min-height:460px;background:var(--bg)}
#cv{position:relative;width:2700px;height:1700px;background-image:radial-gradient(var(--l) 1.2px,transparent 1.2px);background-size:20px 20px}
#ev{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#ev path{fill:none;stroke:var(--b);stroke-width:2.5;pointer-events:stroke;cursor:pointer}
.nd{position:absolute;width:240px;border:1px solid var(--l);border-radius:8px;background:var(--bg);box-shadow:0 2px 8px rgba(0,0,0,.15)}
.nh{color:#fff;padding:8px 10px;border-radius:7px 7px 0 0;display:flex;align-items:center;justify-content:space-between;cursor:grab;touch-action:none;position:relative;gap:6px}
.nh b{font-size:13px;flex:1;padding-left:6px}.nh .x{background:transparent;padding:0 4px;font-size:14px}
.nb{padding:10px 10px 4px}.nb label{font-size:12px;margin-bottom:8px}.nb input,.nb textarea,.nb select{font-size:12px;padding:5px 7px}
.no{position:relative;font-size:12px;font-weight:600;padding:6px 14px 6px 0;margin-bottom:4px;border-top:1px dashed var(--l);text-align:right}
.pt{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--b);cursor:pointer;position:absolute;top:50%;transform:translateY(-50%)}
.pt.on{background:var(--b)}.pt.in{left:-8px;background:var(--b);border-color:#fff;box-shadow:0 0 0 2px var(--b)}.no .pt{right:-18px}
.pb{padding:5px 10px;font-size:12px;border-radius:99px;color:#fff}
.bw{display:grid;grid-template-columns:210px 1fr;gap:12px;align-items:start}
.pal{max-height:68vh;overflow:auto}.tg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.tl{background:transparent;color:var(--t);padding:2px;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.ti{width:44px;height:44px;border-radius:10px;display:grid;place-items:center}
#cvp{position:relative}#cv{transform-origin:0 0}
.zc{position:absolute;left:10px;bottom:10px;display:flex;flex-direction:column;gap:4px}.zc button{background:var(--bg);color:var(--t);border:1px solid var(--l);width:32px;height:32px;padding:0}
@media(max-width:760px){.bw{grid-template-columns:1fr}.pal{max-height:none}}
@media(max-width:900px){.bw{grid-template-columns:1fr}.pal{max-height:none;display:flex;gap:12px;overflow-x:auto}.pal>b,.pal>p{display:none}.tg{display:flex;gap:10px;margin:0}.tl{flex:none;width:78px}}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) button.o{color:#8db3f5;border-color:#8db3f5}:root:not([data-theme=light]) .cv b.u,:root:not([data-theme=light]) table a{color:#8db3f5!important}}
.kb{display:flex;gap:12px;overflow-x:auto;align-items:flex-start;padding-bottom:8px}
.kc{flex:none;width:230px;background:var(--s);border:1px solid var(--l);border-radius:8px;padding:10px;min-height:120px}
.kh{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.kd{background:var(--bg);border:1px solid var(--l);border-radius:6px;padding:8px 10px;margin-bottom:8px;cursor:grab}
#cm{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:8;place-items:center;padding:16px}
.mb{background:var(--bg);border:1px solid var(--l);border-radius:10px;padding:18px;width:min(660px,100%);max-height:90vh;overflow:auto}
</style></head><body>
<div id="login"><div class="c" style="width:min(340px,92%)"><div class="lg"><img class="lgi" alt="AgentifyMe"></div><p class="sub">Sign in to the demo.</p>
<label>Role<select id="role" onchange="$('#agw').style.display=this.value=='Agent'?'block':'none'"><option>Client</option><option>Agent</option></select></label><label id="agw" style="display:none">Agent name<select id="agn"><option>Priya</option><option>Imran</option></select></label>
<label>Email<input value="demo@client.com"></label><button style="width:100%" onclick="signin()">Sign in</button></div></div>
<div id="app"><nav id="nav"></nav><main id="main"></main></div><div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);
const S={v:{cta:'Book a call, Get price, Download guide'},hook:'',log:[],auto:{},cf:'all',ca:'all',cs:'new',un:false,open:0,chat:[['b','Hi! How can we help you today?']],plan:'Quarterly'};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const toast=m=>{const t=$('#toast');t.textContent=m;t.className='show';setTimeout(()=>t.className='',2600)};
const CH={fb:['Facebook','--fb'],ig:['Instagram','--ig'],wa:['WhatsApp','--wa']};
const dot=c=>`<span class="dot" style="background:var(${CH[c][1]})"></span>${CH[c][0]}`;
const contacts=[['Aarav Mehta','+91 98200 11234','aarav@example.com','wa','Hot lead','Webinar list'],['Sara Khan','+971 50 123 4567','sara@example.com','ig','Coach','Instagram leads'],['Rohit Verma','+91 98765 43210','rohit@example.com','fb','New','Facebook ads'],['Fatima Ali','+971 55 987 6543','fatima@example.com','wa','Customer','Clients'],['Neha Kapoor','+91 99887 76655','neha@example.com','ig','Hot lead','Instagram leads'],['Omar Siddiqui','+971 52 334 5566','omar@example.com','wa','Consultant','Webinar list']];
const convos=[{n:'Aarav Mehta',c:'wa',a:'Priya',u:1,ts:6,t:'09:42',m:['Hi, what are your coaching packages?','We offer three programs. Want a quick call?','Yes, tomorrow evening works']},{n:'Sara Khan',c:'ig',a:'Imran',u:1,ts:5,t:'09:10',m:['Saw your reel on AI automation','Thanks! Would you like the price list?']},{n:'Rohit Verma',c:'fb',a:'Priya',u:0,ts:4,t:'Yesterday',m:['Is the workshop still open?','Yes, 12 seats left. Want one?']},{n:'Fatima Ali',c:'wa',a:'Imran',u:0,ts:3,t:'Yesterday',m:['Please send the invoice','Sent to your email.']},{n:'Neha Kapoor',c:'ig',a:'Priya',u:1,ts:2,t:'Mon',m:['Do you offer corporate training?']},{n:'Omar Siddiqui',c:'wa',a:'Imran',u:0,ts:1,t:'Sun',m:['Thanks for the demo!','Happy to help.']}];
const flows=[['Welcome message','Runs when a new person messages you'],['Comment to DM','Runs when someone comments a keyword on a post'],['Lead capture','Asks name, phone and email, then saves the contact'],['Follow-up after 24 hours','Runs when a chat goes quiet for a day'],['Book a call','Sends your calendar link after a reply']];
const plans=[['Quarterly',3],['Half-yearly',6],['Yearly',12]];
const inr=n=>'₹'+n.toLocaleString('en-IN');
const NAV=[['home','Home'],['ai','AI'],['contacts','Contacts'],['automations','Automations'],['inbox','Inbox'],['connector','Connector'],['billing','Billing and payment'],['support','Support']];
const send=(type,data)=>{const p={type,time:new Date().toISOString(),...data};S.log.unshift(['out',type,p]);if(S.hook)fetch(S.hook,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)}).catch(()=>{});toast(S.hook?'Sent to your webhook':'Saved in demo. Add a webhook URL in Connector to send for real.')};
const fld=(n,l,ph,a)=>`<label>${l}${a?`<textarea name="${n}" rows="3" placeholder="${ph}" oninput="S.v[this.name]=this.value">${esc(S.v[n]||'')}</textarea>`:`<input name="${n}" placeholder="${ph}" value="${esc(S.v[n]||'')}" oninput="S.v[this.name]=this.value">`}</label>`;
const donut=d=>{const T=d.reduce((a,x)=>a+x[1],0),C=2*Math.PI*40;let o=0;return `<svg viewBox="0 0 120 120" width="150" role="img" aria-label="Messages by channel">`+d.map(x=>{const l=x[1]/T*C,s=`<circle cx="60" cy="60" r="40" fill="none" stroke="var(${x[2]})" stroke-width="18" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-o}" transform="rotate(-90 60 60)"/>`;o+=l;return s}).join('')+`<text x="60" y="64" text-anchor="middle" font-size="13" font-weight="700" fill="var(--t)">${T.toLocaleString('en-IN')}</text></svg>`};
const line=v=>{const W=320,H=120,mx=Math.max(...v),p=v.map((y,i)=>[10+i*(W-20)/(v.length-1),H-10-y/mx*(H-30)]);return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Messages in the last 7 days"><polyline fill="none" stroke="var(--b)" stroke-width="2.5" points="${p.map(x=>x.join(',')).join(' ')}"/>`+p.map(x=>`<circle cx="${x[0]}" cy="${x[1]}" r="3.5" fill="var(--b)"/>`).join('')+`</svg>`};
const bars=d=>{const mx=Math.max(...d.map(x=>x[1]));return d.map(x=>`<div class="br"><span>${x[0]}</span><i style="width:${x[1]/mx*100}%"></i><b>${x[1]}</b></div>`).join('')};
const ctas=()=>(S.v.cta||'').split(',').map(s=>s.trim()).filter(Boolean);
const P={
home(){const h=new Date().getHours(),g=h<12?'Good morning':h<18?'Good afternoon':'Good evening',D=[['Facebook',4200,'--fb'],['Instagram',3600,'--ig'],['WhatsApp',4680,'--wa']];
return `<h2>${g}, Demo Client</h2><p class="sub">Here is how your channels did this week. Sample data.</p>
<div class="g g4"><div class="c k"><b>12,480</b><span>Messages</span></div><div class="c k"><b>1,236</b><span>New contacts</span></div><div class="c k"><b>94%</b><span>Reply rate</span></div><div class="c k"><b>5</b><span>Active automations</span></div></div>
<div class="g g2" style="margin-top:14px"><div class="c"><h3>Messages by channel</h3><div class="row">${donut(D)}<div>${D.map(x=>`<div><span class="dot" style="background:var(${x[2]})"></span>${x[0]} ${x[1].toLocaleString('en-IN')}</div>`).join('')}</div></div></div>
<div class="c"><h3>Messages, last 7 days</h3>${line([1450,1620,1380,1900,2100,1750,2280])}<div class="dl"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div></div>
<div class="c"><h3>Leads by call to action</h3>${bars([['Book a call',320],['Get price',210],['Download guide',140],['Chat on WhatsApp',95]])}</div>
<div class="c"><h3>New contacts by channel</h3>${bars([['Facebook',380],['Instagram',420],['WhatsApp',436]])}</div></div>`},
ai(){return `<h2>AI</h2><p class="sub">Fill in these details. We build a system prompt from them and send it to your agent.</p>
<div class="g g2"><div class="c"><h3>Founder persona</h3>${fld('identity','Identity','Who you are and what you do',1)}${fld('voice','Voice','How you sound: warm, direct, playful',1)}${fld('use','Words to use','one, two, three')}${fld('avoid','Words not to use','one, two, three')}${fld('sample','Sample conversation','Customer: …&#10;You: …',1)}</div>
<div class="c"><h3>Brand persona</h3>${fld('pos','Positioning','What makes you different',1)}${fld('icp','Ideal customer','Who you serve',1)}${fld('svc','Services','What you sell',1)}${fld('off','Offers','Current offers and prices',1)}${fld('cta','Calls to action','Separate with commas')}</div></div>
<div class="row" style="margin:14px 0"><button onclick="gen()">Generate system prompt</button><button class="o" onclick="send('system_prompt',{prompt:S.prompt||''})">Send to agent</button></div>
<div class="c"><h3>System prompt</h3><pre id="sp">${esc(S.prompt||'Your system prompt will appear here.')}</pre></div>`},
contacts(){const L={};contacts.forEach(c=>L[c[5]]=(L[c[5]]||0)+1);return `<h2>Contacts</h2><p class="sub">${contacts.length} contacts. Sample data.</p>
<div class="row" style="margin-bottom:14px"><label class="btn" style="margin:0">Import CSV<input type="file" accept=".csv" hidden onchange="imp(this)"></label><span class="sub" style="margin:0">Columns: name, phone, email</span></div>
<div class="row" style="margin-bottom:14px">${Object.entries(L).map(([k,v])=>`<span class="chip">${k} · ${v}</span>`).join('')}</div>
<div class="c sc"><table><tr><th>Name</th><th>Phone</th><th>Email</th><th>Channel</th><th>Label</th><th>List</th></tr>${contacts.map(c=>`<tr><td>${c[0]}</td><td>${c[1]}</td><td>${c[2]}</td><td>${dot(c[3])}</td><td><span class="chip">${c[4]}</span></td><td>${c[5]}</td></tr>`).join('')}</table></div>`},
automations(){return `<h2>Automations</h2><p class="sub">Ready-made flows. Pick the call to action each one uses. Add calls to action in AI > Brand persona.</p><div class="g g2">${flows.map((f,i)=>`<div class="c"><h3>${f[0]}</h3><p class="sub" style="margin-bottom:10px">${f[1]}</p><label>Call to action<select onchange="S.auto[${i}]=this.value">${ctas().map(c=>`<option ${S.auto[i]==c?'selected':''}>${esc(c)}</option>`).join('')}</select></label><button class="${S.auto['on'+i]?'':'o'}" onclick="tg(${i})">${S.auto['on'+i]?'Turn off':'Turn on'}</button></div>`).join('')}</div>`},
inbox(){let l=convos.filter(c=>(S.cf=='all'||c.c==S.cf)&&(S.ca=='all'||c.a==S.ca)&&(!S.un||c.u)).sort((a,b)=>S.cs=='new'?b.ts-a.ts:a.ts-b.ts);const o=convos[S.open];
return `<h2>Inbox</h2><p class="sub">Sample conversations.</p><div class="row" style="margin-bottom:14px"><select style="width:auto" onchange="S.cf=this.value;R()"><option value="all">All channels</option>${Object.entries(CH).map(([k,v])=>`<option value="${k}" ${S.cf==k?'selected':''}>${v[0]}</option>`).join('')}</select><select style="width:auto" onchange="S.ca=this.value;R()"><option value="all">All agents</option>${['Priya','Imran'].map(a=>`<option ${S.ca==a?'selected':''}>${a}</option>`).join('')}</select><select style="width:auto" onchange="S.cs=this.value;R()"><option value="new">Newest first</option><option value="old" ${S.cs=='old'?'selected':''}>Oldest first</option></select><label style="margin:0"><input type="checkbox" style="width:auto" ${S.un?'checked':''} onchange="S.un=this.checked;R()"> Unread only</label></div>
<div class="inb"><div class="c" style="padding:0">${l.map(c=>`<div class="cv ${c==o?'on':''}" onclick="S.open=${convos.indexOf(c)};c0(${convos.indexOf(c)})"><div><b class="${c.u?'u':''}">${c.n}</b> <span class="sub" style="float:right;margin:0">${c.t}</span></div><div class="sub" style="margin:0">${dot(c.c)} · ${c.a}</div></div>`).join('')||'<p style="padding:12px">No conversations match these filters.</p>'}</div>
<div class="c"><h3>${o.n} · ${CH[o.c][0]} · ${o.a}</h3>${o.m.map((m,i)=>`<div class="bub ${i%2?'me':''}">${esc(m)}</div>`).join('')}</div></div>`},
connector(){return `<h2>Connector</h2><p class="sub">Connect your webhook. The app sends your prompt, automations and messages, and can receive replies.</p>
<div class="c" style="margin-bottom:14px">${'<label>Webhook URL<input id="hk" placeholder="https://example.com/webhook/..." value="'+esc(S.hook)+'"></label>'}<div class="row"><button onclick="S.hook=$('#hk').value.trim();toast('Webhook saved');R()">Save</button><button class="o" onclick="send('test',{note:'Test from Agentify Me'});R()">Send test</button><button class="o" onclick="sim()">Simulate incoming message</button></div></div>
<div class="c"><h3>Activity</h3>${S.log.length?S.log.slice(0,8).map(x=>`<p style="margin:6px 0"><span class="chip">${x[0]=='out'?'Sent':'Received'}</span> ${x[1]} <code style="color:var(--m)">${esc(JSON.stringify(x[2]).slice(0,90))}…</code></p>`).join(''):'<p class="sub">Nothing yet. Send a test to see activity.</p>'}</div>`},
billing(){return `<h2>Billing and payment</h2><p class="sub">Sample data.</p>
<div class="c sc" style="margin-bottom:14px"><table><tr><th>Package</th><th>Purchased</th><th>Subscription started</th><th>Next billing</th><th>Expires</th></tr><tr><td>${S.plan}</td><td>1 Oct 2026</td><td>1 Oct 2026</td><td>1 Jan 2027</td><td>31 Dec 2026</td></tr></table></div>
<div class="g g2">${plans.map(p=>`<div class="c pl ${S.plan==p[0]?'on':''}"><h3>${p[0]}</h3><b style="font-size:24px">${inr(8000*p[1])}</b><p class="sub">${inr(8000)} a month for ${p[1]} months<br>One-time setup fee ${inr(25000)}</p><div class="row"><button onclick="pay('${p[0]}','Razorpay')">Pay with Razorpay</button><button class="o" onclick="pay('${p[0]}','Stripe')">Pay with Stripe</button></div></div>`).join('')}</div>
<div class="c" style="margin-top:14px"><h3>Credits</h3><p class="sub">Message credits are bought from Meta with your own card.</p><button onclick="toast('Demo: this opens Meta billing')">Purchase credits</button></div>`},
